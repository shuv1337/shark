name: SHark Production Update

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for this private production update
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shark-production-update
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and deploy reviewed SHA
    runs-on: ubuntu-latest
    environment: shark-production
    timeout-minutes: 45
    env:
      DEPLOY_HOST: ${{ secrets.SHARK_DEPLOY_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.SHARK_DEPLOY_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SHARK_DEPLOY_SSH_KNOWN_HOSTS }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install reviewed dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify monorepo
        run: |
          pnpm typecheck
          pnpm test
          pnpm lint
          pnpm build
          pnpm brand:check
          bash -n deploy/shark-deploy deploy/shark-backup \
            deploy/shark-materialize-secrets deploy/shark-restic-backup deploy/test-helpers
          deploy/test-helpers
          docker build --tag "shark:${GITHUB_SHA}" .

      - name: Create exact-source archive
        run: git archive --format=tar.gz --output=shark-source.tar.gz "$GITHUB_SHA"

      - name: Configure restricted SSH transport
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/shark_deploy
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/shark_deploy
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy through the host wrapper
        run: |
          ssh -i ~/.ssh/shark_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o RequestTTY=no \
            "$DEPLOY_HOST" "deploy ${GITHUB_SHA}" < shark-source.tar.gz

      - name: Verify private production boundary
        run: |
          curl --fail --show-error --silent --retry 12 --retry-all-errors \
            https://shark.shuv.dev/api/health >/dev/null
          for path in / /docs /privacy /terms /dashboard /cli/authorize; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "https://shark.shuv.dev${path}")"
            case "$status" in
              302|303|307|401) ;;
              *) echo "Unexpected anonymous status ${status} for ${path}" >&2; exit 1 ;;
            esac
          done
          for path in /robots.txt /sitemap.xml; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "https://shark.shuv.dev${path}")"
            [[ "$status" == "404" ]] || {
              echo "Unexpected removed-surface status ${status} for ${path}" >&2
              exit 1
            }
          done
