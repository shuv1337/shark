name: SHark Production Update

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for this private production update
        required: true
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: shark-production-update
  cancel-in-progress: false

jobs:
  verify-and-publish:
    name: Verify and publish reviewed SHA
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: shark-production
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install reviewed dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify monorepo
        run: |
          pnpm typecheck
          pnpm test
          pnpm lint
          pnpm build
          pnpm brand:check
          bash -n deploy/shark-deploy deploy/shark-backup \
            deploy/shark-materialize-secrets deploy/shark-restic-backup deploy/test-helpers
          deploy/test-helpers

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record promotion coordinates
        run: |
          {
            echo "## SHark production candidate"
            echo
            echo "- Git SHA: \`${GITHUB_SHA}\`"
            echo "- Image: \`ghcr.io/${GITHUB_REPOSITORY}@${{ steps.push.outputs.digest }}\`"
            echo
            echo "Promote only after this run and its required source checks are green."
          } >>"$GITHUB_STEP_SUMMARY"
