name: SHarkMac
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: dev.shuv.shark.macos
    DEVELOPMENT_TEAM: 7H54B326YZ
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production
targets:
  SHarkMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/SHarkMac.entitlements
      properties:
        com.apple.developer.aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
    scheme:
      testTargets:
        - SHarkMacTests
  SHarkMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: SHarkMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shuv.shark.macos.tests
        GENERATE_INFOPLIST_FILE: YES
