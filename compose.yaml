# The server listens on plain HTTP. The edge must terminate TLS, forward to
# 127.0.0.1:8787, and append the client IP (exe.dev is one hop;
# TRUSTED_FORWARDED_FOR_HOPS). Responses include
# Strict-Transport-Security: max-age=15552000; includeSubDomains, which browsers
# honor when the edge forwards that header on HTTPS.
services:
  shark:
    image: ${SHARK_IMAGE:?set SHARK_IMAGE to the reviewed immutable GHCR digest}
    ports:
      # Bind publicly only behind a trusted proxy; auth rate limits use its client-IP headers.
      - "127.0.0.1:8787:8787"
    # Only /data (the volume) and /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: self_hosted
      PORT: "8787"
      DATABASE_URL: /data/hark.sqlite
      # Public origin of this deployment (used for OAuth redirects + webhook URLs).
      APP_URL: ${APP_URL:?set APP_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?set ALLOWED_EMAILS in .env}
      APPLE_SIGN_IN_SERVICE_ID: ${APPLE_SIGN_IN_SERVICE_ID:?set APPLE_SIGN_IN_SERVICE_ID in .env}
      APPLE_SIGN_IN_BUNDLE_ID: dev.shuv.shark
      APPLE_SIGN_IN_KEY_ID: ${APPLE_SIGN_IN_KEY_ID:?set APPLE_SIGN_IN_KEY_ID in .env}
      APPLE_SIGN_IN_PRIVATE_KEY: ${APPLE_SIGN_IN_PRIVATE_KEY:?set APPLE_SIGN_IN_PRIVATE_KEY in .env}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:?set EXPO_ACCESS_TOKEN in .env}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?set VAPID_PUBLIC_KEY in .env}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?set VAPID_PRIVATE_KEY in .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?set VAPID_SUBJECT in .env}
      APNS_KEY_ID: ${APNS_KEY_ID:?set APNS_KEY_ID in .env}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:?set APPLE_TEAM_ID in .env}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:?set APNS_PRIVATE_KEY in .env}
      APNS_SANDBOX_KEY_ID: ${APNS_SANDBOX_KEY_ID:?set APNS_SANDBOX_KEY_ID in .env}
      APNS_SANDBOX_PRIVATE_KEY: ${APNS_SANDBOX_PRIVATE_KEY:?set APNS_SANDBOX_PRIVATE_KEY in .env}
      APNS_BUNDLE_ID: dev.shuv.shark
      APNS_MACOS_BUNDLE_ID: dev.shuv.shark.macos
      APNS_ENVIRONMENT: production
      SERVICE_RATE_LIMIT_PER_MINUTE: ${SERVICE_RATE_LIMIT_PER_MINUTE:-300}
      ACCOUNT_RATE_LIMIT_PER_MINUTE: ${ACCOUNT_RATE_LIMIT_PER_MINUTE:-1500}
      # The exe.dev proxy appends the client IP to X-Forwarded-For (one trusted hop).
      TRUSTED_FORWARDED_FOR_HOPS: ${TRUSTED_FORWARDED_FOR_HOPS:-1}
    volumes:
      - shark-data:/data
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "7"

volumes:
  shark-data:
    name: shark-data
